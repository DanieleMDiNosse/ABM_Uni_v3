# Scenario: wide volatility range for 5-quantile conditioned analysis
# Uses a heston_theta_schedule to steer the variance process through
# five distinct regimes (very-low → very-high σ) within a single run.
fee_mode: volatility_dex
simulate:
  config_name: vol_conditioned_wide
  liquidity_for_gif: false
  verbose: true
  light_mode: false
  block_time: 5
  T: 13000
  skip_step: 3000
  n_block_SR_ratio: 100
  seed: 10
  cex_mu: 0.00
  cex_sigma_mode: heston
  cex_sigma: 0.00015

  # Heston base parameters
  cex_heston_kappa: 0.5          # slower reversion → variance tracks θ schedule smoothly
  cex_heston_theta: 1.0e-9       # initial θ (overridden by schedule at t=0)
  cex_heston_sigma_v: 0.0005     # moderate vol-of-vol
  cex_heston_rho: -0.5
  cex_heston_v0: 1.0e-9          # start in very-low variance regime

  # Time-varying θ: five segments of equal duration (T/5 blocks each).
  # Order is shuffled per seed for schedule-order diversity.
  # σ_t ≈ sqrt(θ) once the process has mean-reverted.
  cex_heston_theta_schedule:
    - 1.0e-9     # very-low  (σ ≈ 3e-5)
    - 5.0e-9     # low       (σ ≈ 7e-5)
    - 2.5e-8     # medium    (σ ≈ 1.6e-4)
    - 1.0e-7     # high      (σ ≈ 3.2e-4)

  # Traders
  smart_trades_per_second: 0.16
  noise_trades_per_second: 0.16
  trader_mean: 2.5
  trader_sigma: 1.5
  theta_T: 1.0
  slippage_tolerance: 0.01

  # Arbitrageurs
  flash_loan_fee: 0.0001

  # LPs
  N_LP: 100
  passive_lp_share: 0.5
  narrow_mints_per_second: 0.10
  passive_mints_per_second: 0.10
  passive_burns_per_second: 0.10
  passive_width_pct: 5.0
  passive_width_ticks: null
  tau_seconds: 25.0
  w_min_ticks: 10
  w_max_ticks: 1774540
  basis_half_life: 1
  slope_s: 1
  binom_n: 70
  binom_p: 0.5
  k_out_min: 10
  k_out_max: 20
  mint_mu: -1.0
  mint_sigma: 1.5
  theta_TP: 0.1
  theta_SL: 0.20

  # JIT
  p_jit: 1
  N_jit: 3
  liquidity_perc_jit: 0.90
  jit_flash_loan_fee: 0.0001

  # Initialization
  initial_binom_N: 450
  initial_total_L: 500000.0
  visualize: true

  # Fee controller
  f0: 0.0001
  f_min: 0.00001
  f_max: 0.05
  fee_half_life: 2
  k_sigma: 1
  k_basis: 0.0005
  k_lvr: 0.1
  fee_step_bps_min: 0.0005
  fee_step_bps_max: 100.0
  fee_cooldown: 0
