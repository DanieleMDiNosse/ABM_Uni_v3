# Scenario label defaults to cex_sigma_mode; fee_mode configures the controller
fee_mode: static
# Parameter overrides passed to the simulate() runner
simulate:
  ####  GENERAL SIMULATION PARAMETERS #####
  config_name: test
  liquidity_for_gif: false
  verbose: true
  light_mode: false
  # Seconds per block (micro-step = 1 second). Expected arrivals per block scale with this.
  block_time: 5
  # Total number of simulation blocks to execute
  T: 521400
  # Number of initial steps to omit from visualizations and analytics
  skip_step: 3000
  # Compute smart-router DEX share (DEX/(CEX+DEX)) every n blocks
  n_block_SR_ratio: 100
  # Random seed used for reproducibility across RNGs
  # seed: 7
  seed: 10
  # Drift of the reference CEX price process (per step)
  cex_mu: 0.00
  # Choose between static or Heston volatility modes
  cex_sigma_mode: heston
  # Volatility of the reference CEX price process (per step/second)
  # 1e-4 ~= 56% annualized; 1e-5 ~= 5.6% annualized; 2e-4 ~= 112% annualized
  cex_sigma: 0.00015
  # Heston volatility parameters (used when cex_sigma_mode: heston)
  cex_heston_kappa: 1.0       # mean reversion speed of variance
  cex_heston_theta: 1.0e-8    # long-run variance level
  cex_heston_sigma_v: 0.001     # volatility of variance
  cex_heston_rho: -0.5        # correlation between price and variance shocks
  cex_heston_v0: 2.25e-8      # optional initial variance; defaults to cex_sigma^2 when omitted

  ##### TRADERS #####
  # Poisson intensity per second (micro-step = 1 second) of smart-router trade intents.
  # Expected intents per block scale with block_time: E[block] = block_time * lambda_per_second.
  smart_trades_per_second: 0.16  # ~= 0.8 per 5-second block
  # Poisson intensity per second (micro-step = 1 second) of noise trader intents.
  noise_trades_per_second: 0.16  # ~= 0.8 per 5-second block
  # Mean of log-normal order size distribution for traders
  trader_mean: 2.5
  # Standard deviation of log-normal order size distribution for traders
  trader_sigma: 1.5
  # Threshold multiplier for CEX-vs-DEX price comparison (best execution)
  theta_T: 1.0
  # Maximum relative slippage tolerated by traders
  slippage_tolerance: 0.01

  ##### ARBITRAGEURS #####
  # Percentage fee on arbitrage notional for flash loan usage (e.g., 0.0005 = 5 bps)
  flash_loan_fee: 0.0001


  ##### LIQUIDITY PROVIDERS #####
  # Total number of LP agents instantiated in the simulation
  N_LP: 100
  # Fraction of LP agents designated as passive baseline providers
  passive_lp_share: 0.5
  # Poisson intensities per second for LP actions (micro-step = 1 second).
  narrow_mints_per_second: 0.10   # ~= 0.5 per 5-second block
  passive_mints_per_second: 0.10  # ~= 0.5 per 5-second block
  passive_burns_per_second: 0.10  # ~= 0.5 per 5-second block
  # Passive LP width as a total percentage (± width/2 around the reference price)
  passive_width_pct: 5.0
  # Legacy tick-based width fallback (set a value here only when omitting passive_width_pct)
  passive_width_ticks: null
  # Average cadence (in seconds) between LP reviews of their positions.
  # (Legacy 'tau' in blocks is omitted; use tau_seconds for real-time semantics.)
  tau_seconds: 25.0  # ~= tau=5 blocks * 5 seconds/block
  # Minimum and maximum width in ticks for programmatic LP mints
  w_min_ticks: 10 # 10 corresponds to ~0.1% width
  w_max_ticks: 1774540 
  # Half-life (in blocks) of the EWMA basis signal driving LP widths
  basis_half_life: 1
  # Sensitivity of LP width (ticks per unit of basis signal)
  slope_s: 1
  # Number of trials for the binomial noise component on LP width
  binom_n: 70
  # Success probability for the binomial noise component on LP width
  binom_p: 0.5
  # Range for consecutive out-of-range steps before a narrow LP recenters (sampled per LP)
  k_out_min: 10
  k_out_max: 20
  # Mean of log-normal draw scaling LP mint sizes
  mint_mu: -1.0
  # Standard deviation of log-normal draw scaling LP mint sizes
  mint_sigma: 1.5
  # Take-profit ratio (relative to initial HODL value) for LP burn decisions
  theta_TP: 0.1
  # Stop-loss ratio (relative to initial HODL value) for LP burn decisions
  theta_SL: 0.20

  ##### JIT LP (Jiter) #####
  # Bernoulli arrival probability per block (Jiter runs only when block_time > 1)
  p_jit: 0
  # Target up to top-N swaps by input size per arriving block
  N_jit: 3
  # Target share of active liquidity to temporarily add in a narrow band (0-1)
  liquidity_perc_jit: 0.90
  # Flash loan fee for the jiter
  jit_flash_loan_fee: 0.0001


  #### INITIALIZATION & VISUALIZATION #####
  # Binomial hill depth used to seed initial liquidity distribution
  initial_binom_N: 450
  # Total initial liquidity deployed across seed LPs
  initial_total_L: 500000.0
  # Whether to generate plots and GIFs at the end of the run
  visualize: true



  ##### FEE CONTROLLER #####
  # Baseline fee level applied when controller is static or as floor for dynamics
  f0: 0.0001
  # Minimum fee cap enforced by the controller
  f_min: 0.00001
  # Maximum fee cap enforced by the controller
  f_max: 0.05
  # Half-life (n blocks) of the EWMA used for fee controller signals
  fee_half_life: 2
  # Multiplier converting EWMA volatility into a fee adjustment (volatility mode)
  k_sigma: 1
  # Multiplier converting EWMA basis (ticks) into a fee adjustment (toxicity mode)
  k_basis: 0.0005
  # Feedback gain for EWMA(dLVR - dFees) / notional (lvr_fee_ewma mode)
  k_lvr: 0.1
  # Minimum absolute fee change (in bps) required before committing an update. A value of 0.0005 corresponds to 0.000005 = 0.0005% of the previous fee
  fee_step_bps_min: 0.0005
  # Maximum fee change (in bps) allowed per update step
  fee_step_bps_max: 100.0
  # Cooldown (steps) between consecutive fee updates
  fee_cooldown: 0
