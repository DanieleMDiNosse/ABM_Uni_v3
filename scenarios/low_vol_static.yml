# Fee mode (also used as the scenario label)
fee_mode: static
# Parameter overrides passed to the simulate() runner
simulate:
  ####  GENERAL SIMULATION PARAMETERS #####
  # Number of micro-time steps aggregated per block (1 switches to non-block mode)
  block_time: 12
  # Total number of simulation blocks to execute
  T: 10000
  # Number of initial steps to omit from visualizations and analytics
  skip_step: 1000
  # Random seed used for reproducibility across RNGs
  seed: 7
  # Drift of the reference CEX price process (per step)
  cex_mu: 0.00
  # Choose between constant sigma or a 2-state regime-switching sigma
  cex_sigma_mode: static
  # Volatility of the reference CEX price process (per step/second)
  # 1e-4 ~= 56% annualized; 1e-5 ~= 5.6% annualized; 2e-4 ~= 112% annualized
  cex_sigma: 0.0001
  cex_sigma_low: 0.0001
  cex_sigma_high: 0.002
  cex_sigma_p_LL: 0.98
  cex_sigma_p_HH: 0.95
  cex_sigma_regime_init: L
  cex_sigma_sine_noise: 0.0
  cex_sigma_sine_period: 10000
  cex_sigma_sine_amp: null
  cex_sigma_sine_phase: 0.0
  cex_sigma_floor: 0.0

  ##### TRADERS #####
  # Expected number of smart-router trade intents per block
  smart_trades_per_block: 1.2
  # Expected noise trader intents per block
  noise_trades_per_block: 1.2
  # Mean of log-normal order size distribution for traders
  trader_mean: 2.5
  # Standard deviation of log-normal order size distribution for traders
  trader_sigma: 1.5
  # Threshold multiplier for CEX-vs-DEX price comparison (best execution)
  theta_T: 0.98
  # Maximum relative slippage tolerated by traders
  slippage_tolerance: 0.01


  ##### LIQUIDITY PROVIDERS #####
  # Total number of LP agents instantiated in the simulation
  N_LP: 10
  # Fraction of LP agents designated as passive baseline providers
  passive_lp_share: 0.3
  # Expected number of narrow LP mints per block (total across narrow LPs)
  narrow_mints_per_block: 16.8
  # Expected number of passive LP mints per block (total across passive LPs)
  passive_mints_per_block: 9.0
  # Expected number of passive LP burns per block (total across passive LPs)
  passive_burns_per_block: 9.0
  # Range width in ticks used for passive LP positions
  passive_width_ticks: 50 # 500 corresponds to ~10% of the initial price
  # Average cadence (in steps) between LP reviews of their positions
  tau: 20
  # Minimum and maximum width in ticks for programmatic LP mints
  w_min_ticks: 10 # 10 corresponds to ~0.2% of the initial price
  w_max_ticks: 1774540
  # Half-life (steps) of the EWMA basis signal driving LP widths
  basis_half_life: 20
  # Sensitivity of LP width (ticks per unit of basis signal)
  slope_s: 0.15
  # Number of trials for the binomial noise component on LP width
  binom_n: 10
  # Success probability for the binomial noise component on LP width
  binom_p: 0.5
  # Range for consecutive out-of-range steps before a narrow LP recenters (sampled per LP)
  k_out_min: 10
  k_out_max: 30
  # Mean of log-normal draw scaling LP mint sizes
  mint_mu: 2.5
  # Standard deviation of log-normal draw scaling LP mint sizes
  mint_sigma: 1.5
  # Take-profit ratio (relative to initial HODL value) for LP burn decisions
  theta_TP: 0.1
  # Stop-loss ratio (relative to initial HODL value) for LP burn decisions
  theta_SL: 0.25


  #### INITIALIZATION & VISUALIZATION #####
  # Binomial hill depth used to seed initial liquidity distribution
  initial_binom_N: 450
  # Total initial liquidity deployed across seed LPs
  initial_total_L: 500000.0
  # Whether to generate plots and GIFs at the end of the run
  visualize: true



  ##### FEE CONTROLLER #####
  # Baseline fee level applied when controller is static or as floor for dynamics
  f0: 0.0005
  # Minimum fee cap enforced by the controller
  f_min: 0.0001
  # Maximum fee cap enforced by the controller
  f_max: 0.05
  # Half-life (n blocks) of the EWMA used for fee controller signals
  fee_half_life: 10
  # Multiplier converting EWMA volatility into a fee adjustment
  k_sigma: 50
  # Multiplier converting EWMA basis (ticks) into a fee adjustment
  k_basis: 0.001
  # GAS fee mode parameters (volatility level and surprise)
  gas_alpha: 0.05
  gas_beta: 0.9
  gas_omega: 0.0
  k_gas_sigma: 0.0
  k_gas_score: 0.0
  # Minimum absolute fee change (in bps) required before committing an update. A value of 0.001 corresponds to 0.00001 = 0.001% of the previous fee
  fee_step_bps_min: 0.001
  # Maximum fee change (in bps) allowed per update step
  fee_step_bps_max: 20.0
  # Cooldown (steps) between consecutive fee updates
  fee_cooldown: 3
  # Percentage fee on arbitrage notional for flash loan usage (e.g., 0.0005 = 5 bps)
  flash_loan_fee: 0.0
