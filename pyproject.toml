[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amm-abm"
version = "0.2.0"
description = "Agent-Based Model for Uniswap v3 – simulation engine + live Dash webapp"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "ABM_Uni_v3 contributors"},
]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "plotly",
    "pyyaml",
    "tqdm",
    "numba",
    "dash>=2.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff",
]

[project.scripts]
amm-abm-web = "abm_webapp.app:main"

[tool.setuptools]
packages = [
    "abm_webapp",
    "core",
    "scripts",
]

[tool.setuptools.package-data]
"abm_webapp" = ["assets/*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
